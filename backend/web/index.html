<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoltSpace — 租屋用電與迴路安全</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<link rel="stylesheet" href="/app/app.css" />
</head>
<body>
<div class="page">

  <!-- ============ header ============ -->
  <header class="card header">
    <div class="brand">
      <span class="bolt">⚡</span>
      <div>
        <h1>VoltSpace</h1>
        <p class="muted small" data-i18n="brand.tagline">租屋用電估算與迴路安全檢查</p>
      </div>
    </div>
    <div class="header-right">
      <!-- Language switcher, first in the group so it is easy to find. app.js sets the
           label to the language you can switch TO. -->
      <button id="langToggle" class="lang-btn" type="button"
              data-i18n-title="lang.title" title="Switch to English">EN</button>
      <label class="field inline">
        <span class="label" data-i18n="label.plan">電價方案</span>
        <select id="plan"></select>
      </label>
      <label class="field inline">
        <span class="label" data-i18n="label.month">月份</span>
        <select id="month"></select>
      </label>
      <span id="conn" class="pill" data-i18n-title="conn.title" title="後端連線狀態"
            data-i18n="conn.checking">連線中…</span>
    </div>
  </header>

  <!-- ============ body ============ -->
  <main class="layout">

    <!-- left: appliance library -->
    <section class="card drawer">
      <h2 data-i18n="drawer.title">家電庫</h2>
      <p class="muted small" data-i18n="drawer.hint">點選即可加入，數字來自後端參考資料。</p>
      <div id="presets" class="preset-list"></div>
      <button id="customToggle" class="ghost-btn" data-i18n="drawer.custom">＋ 自訂家電</button>
      <!-- novalidate: the browser's native "請輸入有效的值" tooltip is replaced by
           messages from app.js that name the field and say what to type. -->
      <form id="customForm" class="custom-form" novalidate hidden>
        <input id="cName" data-i18n-ph="form.name" placeholder="名稱（例如 除濕機）" maxlength="80" />
        <div class="row2">
          <input id="cWatts" inputmode="decimal" data-i18n-ph="form.watts"
                 placeholder="功率 150 或 150W 都可" />
          <input id="cVolts" inputmode="decimal" data-i18n-ph="form.volts"
                 placeholder="電壓 110 或 110V 都可" value="110" />
        </div>
        <div class="row2">
          <input id="cHours" inputmode="decimal" data-i18n-ph="form.hours"
                 placeholder="每日小時（例 6）" />
          <input id="cDays" inputmode="decimal" data-i18n-ph="form.days"
                 placeholder="每月天數" value="30" />
        </div>
        <input id="cQty" inputmode="decimal" data-i18n-ph="form.qty" placeholder="數量" value="1" />
        <p class="muted small custom-hint" data-i18n="form.hint">只要填數字，單位（W／V／小時）可以省略。</p>
        <div class="row2">
          <button type="submit" class="primary" data-i18n="form.add">加入</button>
          <button type="button" id="customCancel" class="ghost-btn" data-i18n="form.cancel">取消</button>
        </div>
      </form>
    </section>

    <!-- centre: the socket -->
    <section class="centre">
      <h2 class="centre-title" data-i18n="centre.title">主要迴路插座</h2>

      <div id="outlet" class="card outlet">
        <div class="outlet-icon">⏻</div>
        <div id="status" class="status">—</div>
        <div id="watts" class="watts">0 W</div>
        <div id="amps" class="muted small">0 A</div>
        <div class="bar"><div id="bar" class="bar-fill"></div></div>
        <div id="cost" class="cost">—</div>

        <div class="plugged-label" data-i18n="outlet.plugged">已接上的電器</div>
        <ul id="plugged" class="plugged"></ul>
      </div>

      <div class="card circuit">
        <div class="circuit-row">
          <label class="field">
            <span class="label" data-i18n="circuit.label">迴路上限</span>
            <select id="circuit"></select>
          </label>
          <label class="field">
            <span class="label" data-i18n="circuit.custom">自訂上限 (A)</span>
            <input id="ampsLimit" type="number" min="0.1" max="1000" step="0.1" />
          </label>
          <label class="field">
            <span class="label" data-i18n="circuit.margin">安全裕度</span>
            <select id="margin">
              <option value="0.8" data-i18n="margin.80">80%（建議）</option>
              <option value="0.7" data-i18n="margin.70">70%（保守）</option>
              <option value="1.0" data-i18n="margin.100">100%（只看是否超限）</option>
            </select>
          </label>
        </div>
        <div class="row-actions">
          <button id="saveAll" class="primary" data-i18n="actions.save">儲存我的家電</button>
          <button id="reload" class="ghost-btn" data-i18n="actions.reload">重新載入已存清單</button>
          <button id="clearAll" class="danger-btn" data-i18n="actions.clear">全部清除</button>
        </div>
        <p id="saveNote" class="muted small"></p>
      </div>
    </section>

    <!-- right: results -->
    <section class="results">
      <div class="card">
        <h2 data-i18n="results.title">本月估算</h2>
        <dl class="stats">
          <div><dt data-i18n="stat.kwh">每月用電</dt><dd id="sKwh">—</dd></div>
          <div><dt data-i18n="stat.cost">預估電費</dt><dd id="sCost">—</dd></div>
          <div><dt data-i18n="stat.rate">平均每度</dt><dd id="sRate">—</dd></div>
          <div><dt data-i18n="stat.season">季節</dt><dd id="sSeason">—</dd></div>
        </dl>
      </div>

      <div class="card">
        <h2 data-i18n="breakdown.title">用電等級</h2>
        <ul id="breakdown" class="breakdown"></ul>
      </div>

      <div class="card">
        <h2 data-i18n="recs.title">節電建議</h2>
        <p id="saving" class="muted small"></p>
        <ul id="recs" class="recs"></ul>
      </div>

      <details class="card notes">
        <summary data-i18n="notes.summary">計算假設與限制</summary>
        <ul id="disclaimer" class="small muted"></ul>
      </details>
    </section>
  </main>

  <footer class="muted small centre-title">
    <span data-i18n="footer.text">VoltSpace · Group 9 · 計算與電價皆由後端提供，</span>
    <a href="/docs" target="_blank" rel="noreferrer" data-i18n="footer.api">API 文件</a>
  </footer>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/app/app.js"></script>
</body>
</html>
